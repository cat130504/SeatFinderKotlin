name: seatfinder
description: SeatFinder - porting Flutter dell'app Android (Kotlin / Jetpack Compose).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  path_drawing: ^1.0.1
  # Backend (Supabase usato solo come client Postgrest, come nell'app Kotlin)
  supabase_flutter: ^2.8.0
  # Login Esse3 (Basic auth)
  http: ^1.2.2
  # State management
  provider: ^6.1.2
  # Sessione (SharedPreferences, come "LoginPrefs")
  shared_preferences: ^2.3.2
  # Scanner QR (CameraX + ML Kit su Android)
  mobile_scanner: ^7.4.2
  # Posizione e permessi
  geolocator: ^14.1.1
  permission_handler: ^13.0.2

  # Servizio in foreground (PingService) e notifica finale
  flutter_foreground_task: ^11.0.3
  flutter_local_notifications: ^22.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/maps/
